name: 内核构建 - 红米 K Pad 2 (MTK 6.12)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          - SukiSU
          - ReSukiSU
        default: ReSukiSU
      ksu_mode:
        description: "KernelSU / SUSFS 模式"
        required: true
        type: choice
        options:
          - 关闭
          - 禁用SUSFS
          - 禁用KSU
        default: 关闭
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_kpm:
        description: "KPM 功能（patched 尚不支持）"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "上传全部"

jobs:
  build-kpad2:
    name: "KPad2-6.12.38-${{ inputs.kernelsu_variant }}"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android16"
      kernel_version: "6.12"
      sub_level: "38"
      # repo manifest 用 2025-09 分支: 与 yili 基线(MTK alps b0.mp1, 6.12.38)同世代,
      # kleaf/build 工具链为官方配套组合; 内核源码随后被 custom_source 覆盖
      os_patch_level: "2025-09"
      custom_source_repo: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git"
      custom_source_ref: "yili-w-oss"
      ksu_variant: ${{ inputs.kernelsu_variant }}
      ksu_mode: ${{ inputs.ksu_mode }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: false
      use_bbg: false
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: false
      cve_2026_43499_patch: false
      supp_op: false
      enable_susfs: ${{ inputs.ksu_mode != '禁用SUSFS' && inputs.ksu_mode != '禁用KSU' }}
      droidspaces: "off"
      droidspaces_ntsync: false
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
